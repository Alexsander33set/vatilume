name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check repository contents
        run: python scripts/check_repository.py
      - name: Install web and test dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip install -r backend/requirements-dev.txt
          python -c "from fastapi.testclient import TestClient; import httpx"
      - name: Run Python tests without paid inference
        run: python -m unittest discover -s tests
      - name: Build interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install browser for synthetic privacy and budget checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check legal notices and explicit AI budget in browser
        run: |
          python tests/serve_public_validation.py > /tmp/vatilume-synthetic-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8767/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit('Synthetic UI failed to start')
          PY
          cd frontend
          npx playwright test public-readiness.spec.ts
      - name: Build Ubuntu 24.04 amd64 package without root
        run: |
          python -m pip download --only-binary=:all: --require-hashes -r backend/requirements.lock -d scripts/wheels
          python scripts/build_deb.py
          dpkg-deb --info dist/vatilume_*_amd64.deb
          for script in packaging/debian/preinst packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm; do sh -n "$script"; done
