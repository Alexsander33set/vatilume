[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "device-observability"
version = "0.8.0"
description = "Local, durable Linux hardware telemetry collector"
license = {file = "LICENSE"}
authors = [{name = "APFS", email = "contato@apfs.com.br"}]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]

[project.scripts]
device-observability = "device_observability.cli:main"

[tool.setuptools.packages.find]
include = ["device_observability*"]

